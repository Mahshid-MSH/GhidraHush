services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: GhidraHush
    user: "${UID:-1000}:${GID:-1000}" # this is used to allow users modify workspace without sudo
    volumes:
      - .:/app
    env_file:
      - ./.env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    stdin_open: true
    tty: true

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_data: